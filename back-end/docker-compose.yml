name: repono-api
services:
  house:
    build:
      context: .
      dockerfile: ./build/house/Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./:/app
    # depends_on:
    #   house-db:
    #     condition: service_healthy
  house-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - 5432:5432
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: "10s"
      timeout: "5s"
      retries: 5